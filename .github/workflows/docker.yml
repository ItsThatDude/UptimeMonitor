name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore UptimeMonitor.sln

    - name: Build
      run: dotnet build UptimeMonitor.sln --configuration Release --no-restore

    - name: Test
      run: |
        dotnet test UptimeMonitor.sln --configuration Release --no-build --verbosity normal

  push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for pushing to GHCR
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Lowercase repository name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
    
    - name: Build and push (server)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/web.dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LC }}/server:latest
    
    - name: Build and push (remote-monitor)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/monitor.dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LC }}/remote-monitor:latest