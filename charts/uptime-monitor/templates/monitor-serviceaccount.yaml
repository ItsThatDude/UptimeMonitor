{{- if and .Values.remoteMonitor.enabled .Values.remoteMonitor.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uptime-monitor.remoteMonitor.serviceAccountName" . }}
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
  {{- with .Values.remoteMonitor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.remoteMonitor.serviceAccount.automount }}
{{- end }}
