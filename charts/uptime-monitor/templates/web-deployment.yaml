{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-server
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "uptime-monitor.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uptime-monitor.server.labels" . | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.server.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "uptime-monitor.server.serviceAccountName" . }}
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: Logging__LogLevel__Default
              value: Warning
            {{- if .Values.server.database.cnpg.enabled }}
            - name: CONNECTIONSTRINGS__MonitorDbContext
              value: "Server={{ include "uptime-monitor.fullname" . }}-db-rw;Port=5432;Database=uptime-monitor"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime-monitor.fullname" . }}-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime-monitor.fullname" . }}-db-app
                  key: password
            {{- else }}
            - name: CONNECTIONSTRINGS__MonitorDbContext
              value: "Server={{ .Values.server.database.server | required "database server must be provided" }};Port={{ .Values.server.database.port | required "database port must be provided" }};Database={{ .Values.server.database.databaseName }}"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.secretName | required "database secretName must be provided" }}
                  key: {{ .Values.server.database.usernameKey | required "database usernameKey must be provided" }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.secretName | required "database secretName must be provided" }}
                  key: {{ .Values.server.database.passwordKey | required "database passwordKey must be provided" }}
            {{- end }}
            {{- if .Values.server.oidc.enabled }}
            - name: Oidc__NameClaimType
              value: {{ .Values.server.oidc.nameClaimType | quote }}
            - name: Oidc__Authority
              value: {{ .Values.server.oidc.authority | quote }}
            - name: Oidc__ClientId
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.oidc.secretName | quote }}
                  key: {{ .Values.server.oidc.clientIdKey | quote }}
            - name: Oidc__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.oidc.secretName | quote }}
                  key: {{ .Values.server.oidc.clientSecretKey | quote }}
            {{- end }}
            {{- if .Values.server.internalMonitorEnabled }}
            - name: InternalWorker__Enabled
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          {{- with .Values.server.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
          {{- with .Values.server.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-protection
          persistentVolumeClaim:
            claimName: {{ include "uptime-monitor.fullname" . }}-dpkeys
      {{- with .Values.server.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}