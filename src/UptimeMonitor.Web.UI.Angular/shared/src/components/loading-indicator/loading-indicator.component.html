@if(loading$ | async) {
<div class="spinner-container">
    @if(customLoadingIndicator) {
        <ng-container *ngTemplateOutlet="customLoadingIndicator" />
    } @else {
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    }
</div>
}
