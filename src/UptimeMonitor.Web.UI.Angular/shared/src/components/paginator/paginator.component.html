<nav>
    <ul class="pagination pagination-sm">
        <li class="page-item" [class.disabled]="currentPage <= 1">
            <button type="button" class="page-link" (click)="pageChanged.emit(1)" title="First Page">
                <i class="bi-chevron-double-left"></i>
            </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage <= 1">
            <button type="button" class="page-link" (click)="pageChanged.emit(currentPage-1)" title="Previous Page">
                <i class="bi-chevron-left"></i>
            </button>
        </li>
        @for (page of visiblePages; track page) {
            <li class="page-item" [class.active]="page === currentPage">
                <button type="button" class="page-link" (click)="pageChanged.emit(page)" [title]="'Page ' + page">{{ page }}</button>
            </li>
        }
        <li class="page-item" [class.disabled]="currentPage >= pageCount">
            <button type="button" class="page-link" (click)="pageChanged.emit(currentPage+1)" title="Next Page">
                <i class="bi-chevron-right"></i>
            </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage >= pageCount">
            <button type="button" class="page-link" (click)="pageChanged.emit(pageCount)" title="Last Page">
                <i class="bi-chevron-double-right"></i>
            </button>
        </li>
    </ul>
</nav>
