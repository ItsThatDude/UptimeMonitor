<div ngbDropdown placement="bottom-end">
    <button type="button" class="btn btn-outline-primary d-flex justify-content-between align-items-center" ngbDropdownToggle>
        {{selectedLocation() ?? "All Locations"}}
    </button>
    <div ngbDropdownMenu>
        <div class="px-2">
            <input type="search" class="form-control" placeholder="Search..." [formControl]="searchInput" />
        </div>
        <div class="dropdown-divider"></div>
        <button ngbDropdownItem [class.active]="selectedLocation() === undefined" (click)="selectLocation.emit(null)" class="d-flex justify-content-between">
            All Locations
            <i *ngIf="selectedLocation() === undefined" class="bi-check ms-2"></i>
        </button>
        <div class="dropdown-divider" *ngIf="locations().length > 0"></div>
        @for (location of locations(); track location) {
        <button ngbDropdownItem [class.active]="selectedLocation() === location" (click)="selectLocation.emit(location)" class="d-flex justify-content-between">
            {{ location }}
            <i *ngIf="selectedLocation() === location" class="bi-check ms-2"></i>
        </button>
        }
    </div>
</div>
