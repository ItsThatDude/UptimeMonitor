<app-page-header [title]="'Status Pages'">
  <toolbar-content>
    <button type="button" class="btn btn-sm btn-outline-primary" [routerLink]="['create']">
        <i class="bi-plus-circle me-1"></i> Create
    </button>
  </toolbar-content>
</app-page-header>
<div class="table-responsive">
    <table class="table align-middle">
        <thead>
            <tr>
                <th>Name</th>
                <th>Slug</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (page of pages.records; track page.id) {
            <tr>
                <td>
                    {{ page.name }}
                    @if (page.default) { <span class="badge rounded-pill bg-success ms-2"><i class="bi-check-circle"></i> Default</span> }
                </td>
                <td>{{ page.slug }}</td>
                <td class="text-end">
                    <div ngbDropdown class="d-inline-block">
                        <button type="button" class="btn btn-sm btn-outline-primary" [id]="'actions-' + page.id" ngbDropdownToggle>
                            Actions
                        </button>
                        <div ngbDropdownMenu [attr.aria-labelledby]="'actions-' + page.id">
                            @if (!page.default) {
                            <button ngbDropdownItem (click)="setDefault(page.slug)">
                                <i class="bi-check-circle me-2"></i> Set Default
                            </button>
                            }
                            <button ngbDropdownItem [routerLink]="['/status-page', page.slug]">
                                <i class="bi-box-arrow-in-right me-2"></i> View
                            </button>
                            <button ngbDropdownItem [routerLink]="['edit', page.slug]">
                                <i class="bi-pencil-square me-1"></i> Edit
                            </button>
                            <button ngbDropdownItem>
                                <i class="bi-trash me-1"></i> Delete
                            </button>
                        </div>
                    </div>
                </td>
            </tr>
            } @empty {
                <tr>
                    <td colspan="100%" style="text-align: center;">There are no Status Pages configured.</td>
                </tr>
            }
        </tbody>
    </table>
</div>
<lib-paginator [pageCount]="pages.totalPages" [pageSize]="pageSize" [currentPage]="page" (pageChanged)="pageChanged($event)"></lib-paginator>
