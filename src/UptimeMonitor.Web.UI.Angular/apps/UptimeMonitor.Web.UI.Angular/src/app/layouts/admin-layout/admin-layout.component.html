<div class="page-container">
    <header class="navbar bg-dark sticky-top flex-md-nowrap p-0 shadow" data-bs-theme="dark">
        <div class="navbar-brand col-md-3 col-lg-2 me-0 px-3 text-white d-flex align-items-center">
            <i class="brand-logo me-2"></i>
            UptimeMonitor
        </div>
        <div class="navbar-nav flex-row px-3">
            <div class="nav-item text-nowrap d-none d-md-inline-block">
                <a class="nav-link px-3 text-white" href="/">
                    <i class="bi-bookmark-heart-fill me-2"></i> Default Status Page
                </a>
            </div>
            <div class="nav-item text-nowrap d-none d-md-inline-block" ngbDropdown display="dynamic" placement="bottom-end">
                <a class="nav-link px-3 text-white" id="navbar-account-menu" role="button" ngbDropdownToggle>
                    <i class="bi-person-circle me-2"></i>{{ userName }}
                </a>
                <div ngbDropdownMenu aria-labelledby="navbar-account-menu" class="dropdown-menu">
                    <a ngbDropdownItem href="/auth/logout">
                        <i class="bi-box-arrow-left me-2"></i> Logout
                    </a>
                </div>
            </div>
            <div class="nav-item text-nowrap d-md-none">
                <button class="navbar-toggler" type="button" (click)="open(offcanvasContent)"
                    aria-controls="sidebarMenu" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </header>
    <div class="container-fluid">
        <div class="row">
            <ng-template #offcanvasContent let-offcanvas>
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title d-flex align-items-center" id="sidebarMenuLabel">
                        <i class="brand-logo me-2"></i>
                        UptimeMonitor
                    </h5>
                    <button type="button" class="btn-close" (click)="offcanvas.dismiss()"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column p-0 pt-lg-3 overflow-y-auto">
                    <ng-container *ngTemplateOutlet="sidebarMenuContent"></ng-container>
                </div>
            </ng-template>
            <ng-template #sidebarMenuContent>
                <div class="pt-3 flex-grow-1 d-flex flex-column">
                    <ul class="nav flex-column flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/admin/dashboard"
                                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <i class="bi bi-house me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/admin/monitors"
                                routerLinkActive="active">
                                <i class="bi bi-heart-pulse me-2"></i>
                                Monitors
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/admin/workers"
                                routerLinkActive="active">
                                <i class="bi bi-hdd-rack me-2"></i>
                                Workers
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/admin/status-pages"
                                routerLinkActive="active">
                                <i class="bi bi-layout-text-window me-2"></i>
                                Status Pages
                            </a>
                        </li>
                    </ul>
                    <ul class="nav flex-column d-md-none">
                        <li class="nav-item text-nowrap">
                            <a class="nav-link text-nowrap" href="/">
                                <i class="bi-bookmark-heart me-2"></i> Default Status Page
                            </a>
                        </li>
                    </ul>
                    <ul class="nav flex-column d-md-none">
                        <hr class="m-0" />
                        <li class="nav-item text-nowrap">
                            <span class="nav-link text-dark text-nowrap">
                                <i class="bi-person-circle me-2"></i> {{ userName }}
                            </span>
                        </li>
                        <li class="nav-item text-nowrap">
                            <a class="nav-link text-nowrap" href="/auth/logout">
                                <i class="bi-box-arrow-left me-2"></i> Logout
                            </a>
                        </li>
                    </ul>
                </div>
                <hr class="m-0" />
                <div class="py-2 px-3">
                    <lib-theme-select></lib-theme-select>
                </div>
            </ng-template>
            <div class="sidebar border-end col-md-3 col-lg-2 d-none d-md-flex flex-column bg-body-tertiary">
                <ng-container *ngTemplateOutlet="sidebarMenuContent"></ng-container>
            </div>
            <div class="col-md-9 ms-sm-auto col-lg-10 py-3 px-md-4">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
